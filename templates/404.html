<!-- templates/404.html -->
{% extends 'base.html' %}
{% block title %}404 - Page Not Found{% endblock %}
{% block content %}
<div class="container py-5 text-center my-5">
  <h1 class="display-1 fw-extrabold text-primary">404</h1>
  <h2 class="fw-bold mb-3">Resource Not Found</h2>
  <p class="text-muted mb-4">The requested interface or document could not be located on the server.</p>
  <a href="{% url 'core:index' %}" class="btn btn-primary-custom">Return to Homepage</a>
</div>
{% endblock %}
