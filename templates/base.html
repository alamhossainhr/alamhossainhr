<!DOCTYPE html>
<html lang="en"
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ site_settings.site_name }} | {{ site_settings.site_title_suffix }}{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}{{ site_settings.seo_meta_description }}{% endblock %}">
  
  <!-- Open Graph / Schema -->
  <meta property="og:title" content="{{ site_settings.site_name }} - Portfolio">
  <meta property="og:description" content="{{ site_settings.seo_meta_description }}">
  <meta property="og:type" content="website">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom CSS -->
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>

  {% include 'includes/navbar.html' %}

  <main>
    {% if messages %}
      <div class="container mt-4">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      </div>
    {% endif %}

    {% block content %}{% endblock %}
  </main>

  {% include 'includes/footer.html' %}

  <!-- WhatsApp Floating Trigger -->
  {% if site_settings.whatsapp_number %}
    <a href="https://wa.me/{{ site_settings.whatsapp_number }}" target="_blank" class="floating-whatsapp" aria-label="Direct WhatsApp Contact">
      <i class="bi bi-whatsapp"></i>
    </a>
  {% endif %}

 
<!-- Bootstrap Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Complete Theme Engine -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.documentElement.setAttribute('data-bs-theme', savedTheme);
    })();

    function updateIcons(theme) {
      const toggleButtons = document.querySelectorAll('#theme-toggle, #theme-toggle-mobile, .btn-theme-pill');
      toggleButtons.forEach(btn => {
        btn.innerHTML = theme === 'dark' 
          ? '<i class="bi bi-sun-fill text-warning fs-6"></i>' 
          : '<i class="bi bi-moon-stars-fill text-dark fs-6"></i>';
      });
    }

    function toggleTheme(e) {
      if (e) e.preventDefault();
      const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      const targetTheme = current === 'dark' ? 'light' : 'dark';
      
      document.documentElement.setAttribute('data-theme', targetTheme);
      document.documentElement.setAttribute('data-bs-theme', targetTheme);
      localStorage.setItem('theme', targetTheme);
      updateIcons(targetTheme);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      updateIcons(current);

      // Bind all theme toggles
      const toggleButtons = document.querySelectorAll('#theme-toggle, #theme-toggle-mobile, .btn-theme-pill');
      toggleButtons.forEach(btn => {
        btn.onclick = toggleTheme;
      });

      // Animated Stat Counters
      const counters = document.querySelectorAll('.counter');
      const countObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const counter = entry.target;
            const target = +counter.getAttribute('data-target');
            if (!target) return;
            let count = 0;
            const inc = Math.max(1, target / 100);

            const update = () => {
              count += inc;
              if (count < target) {
                counter.innerText = Math.ceil(count);
                setTimeout(update, 20);
              } else {
                counter.innerText = target;
              }
            };
            update();
            observer.unobserve(counter);
          }
        });
      }, { threshold: 0.2 });

      counters.forEach(counter => countObserver.observe(counter));
    });
  </script>
